server {
    listen 80;
    server_name _;

    root /opt/btc-funding-arb;
    index strategy_board.html;

    location / {
        try_files $uri /strategy_board.html;
        add_header Cache-Control "no-store";
    }

    location /data/ {
        alias /opt/btc-funding-arb/data/;
        add_header Cache-Control "no-store";
    }
}
