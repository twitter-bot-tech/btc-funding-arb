name: Free Observer Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: free-observer-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build public test board
        run: |
          python refresh_strategy_board.py --no-backtest --source bitget
          python paper_trader.py --capital 10000 --quote-usdt 50
          python run_bitget_observer_board.py --once --quote-usdt 5 --public-only
          mkdir -p public
          cp strategy_board.html public/index.html
          cp strategy_board.html public/strategy_board.html

      - name: Persist paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper_state.json data/paper_daily.csv data/btcusdt_15m_spot.csv data/refresh_state.json
          test ! -f data/paper_trades.csv || git add data/paper_trades.csv
          git diff --cached --quiet || git commit -m "Update paper trading state"
          git push || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
